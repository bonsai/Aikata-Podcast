  <script>
    const docs = {"MRD": "# MRD — Market Requirements Document\n\n## 概要\nPodcast Agentは、AIホストと人間の話者による約3分の対話番組を、企画から音声ファイルの書き出しまで一貫して制作するWebアプリ。本書は市場・顧客課題の仮説であり、外部調査による検証は未完了。\n\n## 対象ユーザー\n**Primary:** 自分の考えや活動を音声で発信したい個人クリエイター、書き手、研究者、アーティスト。質問を受けながら考えを整理したい人。\n**Secondary:** 小規模チーム、コミュニティ、イベント運営者。インタビューや活動紹介を短い音声にしたい人。\n\n## 問題仮説\n1. 企画、構成、台本、録音、編集が複数ツールに分散する。\n2. 一人で録音すると質問役や進行役が不足し、話し始めにくい。\n3. 長尺番組の準備と編集が継続の障壁になる。\n4. AIだけでは本人の経験が薄まり、人間だけでは構成や編集が負担になる。\n5. 初心者は音声編集ソフトの習得前に制作意欲を失いやすい。\n\n## 顧客が求める成果\n- 収録を始めるまでの準備時間を減らす。\n- AIホストの質問で人間の考えや経験を引き出す。\n- 約3分の完成音声を短い作業セッションで作る。\n- 台本や音声を修正し、一般的な音声ファイルとして保存する。\n- 特定の配信プラットフォームに閉じず制作物を管理する。\n\n## 価値提案\n**AIに自分の代わりに語らせるのではなく、AIに聞き役を任せ、自分の考えを短い番組にする。**\n差別化仮説は、短尺・対話形式・台本と音声の一体管理・簡単な編集・ファイル持ち出しを一つにまとめる点。優位性はユーザー検証を通じて確認する。\n\n## 代替手段\n- 汎用LLMで台本を作り、別の録音・編集ソフトを使う\n- AI音声生成・AIアバター型サービス\n- 従来型Podcast録音・編集ソフト\n- 音声メモ、文字起こし、動画編集ツール\n- 制作会社や編集者への外注\n\n個別製品の比較や市場シェアはまだ断定しない。ユーザー調査で現在の代替手段、費用、乗り換え理由を確認する。\n\n## 市場参入仮説\n1. 自分の考えや制作過程を発信する個人クリエイターから始める。\n2. 「テーマ→AIホストの質問→人間の回答→約3分の音声出力」を検証する。\n3. 継続制作が確認できた後、履歴管理、テンプレート、バッチ制作、公開支援を検討する。\n\n## 成功条件\n- 初回ユーザーが支援なしで最初の音声を書き出せる。\n- AI生成物だけでなく、自分の回答や経験に価値を感じる。\n- 再度エピソードを制作する。\n- 制作時間・編集負担の軽減が支払意思につながる。\n\n## 未検証事項と次の調査\n初期セグメント、望ましい尺・頻度、AIホストの声や質問スタイル、価格、保存・プライバシー期待、AI音声の権利・開示を調査する。最低5〜10名に現在の制作方法、制作を諦めた経験、完成物の用途、支払意思を聞き、実施前に結果を作らない。\n", "カンバン": "# Podcast Agent — Kanban\n\n> 進捗はこのボードを正本として更新する。詳細な作業手順は `../TASKS.md`、区切りと成果物は `../plan/README.md` を参照。\n\n## ボードの運用ルール\n\n- **Stage** = 大きな開発ゲート／成果物単位\n- **Tier** = 機能の成熟度・依存レベル\n- **Phase** = 実装の順序\n- **Card** = `TASKS.md` のT番号。カードを動かすときはTASKS側も同期する。\n- 一度に進行中にするのは原則1タスク。前段階の受け入れ条件を満たしてから次Stageへ進む。\n\n## Kanban\n\n### BACKLOG\n\n| Card | Stage | Tier | Phase | 内容 | 完了条件 |\n|---|---|---|---|---|---|\n| T12 | S4 Release | Tier 3: 安全性 | P4 | コンプライアンス確認 | 権利・出典・同意の確認結果を記録 |\n| T13 | S4 Release | Tier 3: 安全性 | P4 | セキュリティレビュー | 認可・秘密情報・R2保護・削除を確認 |\n| T14 | S4 Release | Tier 3: 品質 | P4 | E2E・受け入れテスト | 主要フローと失敗系を検証 |\n| T15 | S4 Release | Tier 3: 配備 | P4 | Cloudflareデプロイ | 公開URLで動作確認 |\n\n### READY\n\n| Card | Stage | Tier | Phase | 内容 | 完了条件 |\n|---|---|---|---|---|---|\n| T01 | S1 Core | Tier 1: 基盤 | P0 | アプリ骨格 | ローカル起動・型チェック・テストが動く |\n| T02 | S1 Core | Tier 1: UI | P0 | 基本画面 | 一覧・作成・詳細が操作できる |\n| T03 | S1 Core | Tier 1: 永続化 | P1 | D1 CRUD | エピソードの作成・取得・更新・削除が通る |\n| T04 | S1 Core | Tier 1: 台本 | P1 | 3分台本エディター | 台本を編集・保存・再読込できる |\n| T05 | S1 Core | Tier 1: AI | P1 | 台本生成 | 構造化出力を検証し、失敗時に手動編集できる |\n\n### IN PROGRESS\n\n| Card | Stage | Tier | Phase | 内容 | 完了条件 |\n|---|---|---|---|---|---|\n| — | — | — | — | 現在進行中のカードなし | 作業開始時に1件だけ移動 |\n\n### REVIEW / VERIFY\n\n| Card | Stage | Tier | Phase | 内容 | 完了条件 |\n|---|---|---|---|---|---|\n| — | — | — | — | レビュー待ちなし | 実装・テスト・ブラウザ確認を実施 |\n\n### DONE — 仕様化\n\n| Card | Stage | Tier | Phase | 内容 | 完了条件 |\n|---|---|---|---|---|---|\n| SPEC-01 | S0 Definition | Tier 0: 仕様 | P0 | MVP仕様・スコープ | READMEに目的、範囲、受け入れ条件を記載 |\n| SPEC-02 | S0 Definition | Tier 0: 仕様 | P0 | 開発タスク分解 | TASKS.mdにT01〜T15を記載 |\n| SPEC-03 | S0 Definition | Tier 0: 仕様 | P0 | データモデル・責務 | CONTEXT.mdにスキーマと役割を記載 |\n| SPEC-04 | S0 Definition | Tier 0: ルール | P0 | AI開発ルール | CLAUDE.mdに実装・検証ルールを記載 |\n\n### NEXT UP\n\n1. T01 — 最小アプリの骨格\n2. T02 — 画面の基本導線\n3. T03 — D1 CRUD\n4. T04 — 台本エディター\n5. T05 — 台本生成\n\n## Stage Gate\n\n- S0 → S1: README / CONTEXT / TASKS / CLAUDE が揃っている\n- S1 → S2: エピソード作成から台本保存・再読込まで動作する\n- S2 → S3: 人間録音とAIホスト音声を保存し、再生できる\n- S3 → S4: 編集済み音声をファイルとしてダウンロードできる\n- S4 → Done: セキュリティ・受け入れテストを通過し、Cloudflare上で確認できる\n\n## 更新手順\n\n1. カードの状態をこのファイルで変更する。\n2. `TASKS.md` のチェック状態と矛盾がないか確認する。\n3. Stage gateを満たしたら次Stageへ進める。\n", "ロードマップ": "# ROADMAP — Stage / Tier / Phase\n\n## 用語\n- **Stage:** 開発の大きなゲートと完了条件\n- **Tier:** 機能の成熟度（Tier 0仕様、Tier 1基本フロー、Tier 2制作、Tier 3公開品質）\n- **Phase:** 実装作業のまとまり\n- **Task:** TASKS.mdのT01〜T15にある具体作業\n- **Bolt:** 計画→質問→承認→実装→検証を行う短い作業単位\n\n## Stageロードマップ\n\n| Stage | Tier | Phase | 目的 | 完了ゲート |\n|---|---|---|---|---|\n| S0 Definition | Tier 0 Specification | P0 | 課題、MVP、受け入れ条件を定義 | MRD/PRD/MVP/POCをレビュー |\n| S1 Core | Tier 1 Basic workflow | P0–P1 | エピソードと台本の保存・再開 | 作成→保存→再読込が通る |\n| S2 Audio | Tier 2 Production | P2 | 人間の録音とAIホスト音声 | 両素材を再生できる |\n| S3 Edit & Export | Tier 2 Production | P3 | 最小編集、プレビュー、書き出し | テスト音声を書き出せる |\n| S4 Release | Tier 3 Release quality | P4 | セキュリティ、テスト、公開 | 受け入れ条件とスモークテスト通過 |\n| S5 Validate | Tier 3 Product validation | P5 | 継続利用・顧客課題・価格を検証 | 証拠に基づき次の投資を判断 |\n\n## Phase定義\n- P0 Foundation: 環境、基本設計、品質基準\n- P1 Planning & Script: エピソード管理、台本編集・保存\n- P2 Recording & TTS: 録音、TTSアダプター、素材管理\n- P3 Editing & Export: 非破壊編集、プレビュー、ミックス、ダウンロード\n- P4 Hardening & Release: 認可、削除、テスト、エラー処理、デプロイ\n- P5 Validation: 初期ユーザー、KPI、インタビュー、価格テスト\n\n## 優先順位\n1. POCでTTS、録音、ミックス・出力のリスクを確認。\n2. エピソード→台本→人間録音→再生→ダウンロードの縦切りを成立させる。\n3. TTSを統合し、品質・遅延・コストを測る。\n4. 編集と永続化を完成させる。\n5. セキュリティ、テスト、デプロイ。\n6. 継続利用の証拠が出るまで、配信連携・高度編集・課金を先行実装しない。\n\n## 成果物と判断\nS0はMRD/PRD/MVP/POC、S1はエピソードUIと台本保存、S2は録音/TTS/素材管理、S3は編集と書き出し、S4はセキュリティ・CI・デプロイ、S5はKPIレポートとユーザー調査。Stage完了は文書の存在ではなく、動作・テスト・ユーザー価値の証拠で判断する。\n", "スケジュール": "# TASKS.md — Podcast Agent MVP\n\n> 原則：一度にひとつ。最初に動く縦切りを作り、必要な機能だけ積み上げる。\n>\n> 開発ゲートと分類: [Stage / Tier / Phase計画](./plan/README.md) · 作業状態: [Kanban](./kanban/README.md)\n\n## 現在のフォーカス\n\n- [ ] T01: 最小アプリの骨格とエピソード作成〜台本保存を動かす\n\n## Phase 0 — 土台\n\n> 工数目安: 各タスクの見積もりは実装＋単体テスト＋文書更新を含む保守目安。詳細は [docs/COST-ESTIMATE.md](./docs/COST-ESTIMATE.md)。\n\n- [ ] T01: TypeScript + React + Cloudflare Workers/Hono の最小構成を作る `4〜6h`\n  - [ ] ローカル起動・型チェック・テストのコマンドを定義\n  - [ ] Cloudflare向け設定と環境変数の例を追加\n  - [ ] READMEの開発手順を実際の構成と一致させる\n- [ ] T02: 画面の基本導線を作る `6〜8h`\n  - [ ] エピソード一覧\n  - [ ] 新規エピソードフォーム\n  - [ ] エピソード詳細画面\n  - [ ] 空状態・読み込み中・エラー表示\n\n## Phase 1 — 企画・台本\n\n- [ ] T03: D1の初期スキーマとエピソードCRUD `6〜8h`\n  - [ ] shows / episodes テーブル\n  - [ ] 入力検証と所有権チェックの境界を設ける\n  - [ ] 作成・取得・更新・削除をテスト\n- [ ] T04: 3分番組の構成・台本エディター `10〜14h`\n  - [ ] オープニング、導入、質問、まとめ、クロージングのテンプレート\n  - [ ] 話者・発話順・本文を編集できる\n  - [ ] 台本JSONのバージョンと保存状態を管理\n  - [ ] 目標尺と推定尺を表示し、長すぎる場合は警告\n- [ ] T05: 台本生成サービス `10〜14h`\n  - [ ] LLM呼び出しをプロバイダーアダプターで分離\n  - [ ] 構造化された台本をスキーマ検証\n  - [ ] 失敗時の再試行・手動編集へのフォールバック\n  - [ ] 生成物に「AI生成」を記録し、人間の承認を必須にする\n\n## Phase 2 — 収録・音声素材\n\n- [ ] T06: ブラウザのマイク録音 `12〜16h`\n  - [ ] マイク許可・録音中表示・経過時間\n  - [ ] 開始 / 停止 / 再生 / やり直し\n  - [ ] 対応MIMEタイプを検出し、未対応時は説明を表示\n  - [ ] 録音ファイルをR2へ保存し、DBにassetを記録\n- [ ] T07: AIホスト音声生成 `8〜12h`\n  - [ ] TTSアダプターのインターフェースを定義\n  - [ ] 承認済みホスト台詞を発話単位で生成\n  - [ ] 生成失敗・タイムアウト・プロバイダー制限を表示\n  - [ ] 生成音声をR2へ保存し、話者・モデル・形式を記録\n- [ ] T08: 音声素材の一覧とプレビュー `6〜8h`\n  - [ ] 人間録音とAI音声を区別して表示\n  - [ ] 再生・差し替え・削除\n  - [ ] 削除時にDBメタデータとR2オブジェクトを整合させる\n\n## Phase 3 — 編集・書き出し\n\n- [ ] T09: 最小トラック編集 `14〜18h`\n  - [ ] トラックの順序変更\n  - [ ] 開始 / 終了位置と音量の設定\n  - [ ] 編集内容をJSONとして保存し、原音を破壊しない\n  - [ ] 再生プレビューで編集結果を確認\n- [ ] T10: ミックスとダウンロード `14〜18h`\n  - [ ] ブラウザまたは対応するサーバー処理で完成音声を生成\n  - [ ] MP3出力が利用可能か検証し、非対応時はWAVをフォールバックにする\n  - [ ] 書き出し状態・形式・ファイルサイズを表示\n  - [ ] 完成ファイルをダウンロードできる\n- [ ] T11: 書き出しの堅牢性 `6〜8h`\n  - [ ] 空トラック・破損素材・長時間処理のエラー処理\n  - [ ] 重複実行を防ぎ、失敗した書き出しを再試行できる\n\n## Phase 4 — 安全性・仕上げ・公開\n\n- [ ] T12: コンプライアンス確認 `4〜6h`\n  - [ ] 出典・引用・第三者音源・声の利用権を確認するチェックリスト\n  - [ ] 未解決の重大項目があれば書き出し前に警告\n  - [ ] AI生成音声と人間録音を素材メタデータで識別\n- [ ] T13: セキュリティレビュー `6〜8h`\n  - [ ] 秘密鍵がフロントエンドへ漏れないこと\n  - [ ] エピソード・素材・ダウンロードの認可\n  - [ ] R2の非公開設定と一時URLの期限\n  - [ ] 入力検証、ファイルサイズ上限、削除処理\n- [ ] T14: E2E・手動受け入れテスト `10〜14h`\n  - [ ] 新規エピソード→台本保存→録音→TTS→編集→ダウンロード\n  - [ ] API失敗、マイク拒否、保存失敗、書き出し失敗を確認\n  - [ ] Windows + Chrome/Edgeで操作を確認\n- [ ] T15: Cloudflareへデプロイ `6〜8h`\n  - [ ] D1 / R2 / Workers secretsを設定\n  - [ ] 本番環境のマイグレーション手順を記録\n  - [ ] 公開URLと動作確認結果をREADMEに記録\n\n## 完了\n\n- [x] 初期MVPの要件・データモデル・受け入れ条件を文書化\n- [x] Cloudflare中心の構成とスコープ外を定義\n\n## スコープ外（MVPでは実装しない）\n\n- 配信サービスへの自動投稿、RSS、配信アナリティクス\n- リアルタイム全二重音声会話\n- 高度なDAW編集、複数人同時編集、課金\n- 独自TTSモデルの学習\n\n## 完了の定義\n\n- 対象タスクのコードが動作し、関連テストが通る\n- エラー状態とセキュリティ境界を確認済み\n- ブラウザで実際に操作し、結果を目視確認済み\n- 必要なREADME / CONTEXTの記述が更新されている\n", "PRD": "# PRD — Product Requirements Document\n\n## 製品概要と目標\nAIホストと人間の話者で約3分の音声番組を作り、プレビュー・簡易編集後にダウンロードできるWebアプリ。企画から書き出しまでを一つにつなぎ、人間の声と経験を中心にする。\n\n## 非目標\n初期MVPでは配信サービスへの自動投稿、RSS、配信分析、リアルタイム全二重会話、高度なDAW機能、チーム権限、課金、独自音声モデル学習を実装しない。\n\n## ユーザーストーリー\n- クリエイターとして、番組名・テーマ・対象リスナーを設定してエピソードを始めたい。\n- 話者として、AIが作った構成と台本を確認・修正したい。\n- 話者として、ブラウザマイクで録音し、聞き直してやり直したい。\n- 制作者として、AIホスト音声を生成し、人間音声と組み合わせたい。\n- 制作者として、不要区間を調整し、完成音声をダウンロードしたい。\n- ユーザーとして、後から台本や素材を再編集し、不要素材を削除したい。\n\n## 機能要件\n### P0 — 制作の基礎\n- 番組・エピソードの作成、一覧、詳細表示\n- テーマ、対象リスナー、トーンの入力\n- 約3分の構成と話者別台本の生成または手入力\n- 台本の編集・保存・再読込\n- 制作状態とエラー表示\n\n### P1 — 音声\n- マイク権限の説明、録音開始・停止・再生・やり直し\n- AIホストのTTS生成\n- 人間音声とAI音声を別素材として管理\n- 生成中・失敗・再試行の状態表示\n\n### P2 — 編集と出力\n- トラック順序、開始・終了位置、音量の最小限の調整\n- 原音声を上書きしない非破壊編集\n- ミックス音声の生成とプレビュー\n- MP3が安定しない場合はWAVを優先してダウンロード\n\n### P3 — 信頼性・公開準備\n- D1/R2への永続化、DBとストレージの削除整合\n- APIキーをサーバー側に保管\n- 所有者以外のアクセス拒否\n- 主要フローのテスト、エラー処理、Cloudflareデプロイ手順\n\n## 非機能要件\n- 一般的な最新ブラウザで主要フローを利用できることを目標とする。\n- 録音中、許可、アップロード、削除を明示する。\n- APIキーをフロントエンドに含めない。\n- R2アクセスはサーバーで認可し、必要に応じて期限付きURLを使う。\n- 音声形式・サイズを検証し、失敗時に再試行可能な操作を表示する。\n- LLM/TTSプロバイダーをアダプター経由で交換できるようにする。\n\n## データ概念\nShow、Episode、Script、Asset、Track、Export、ComplianceCheck。具体的なスキーマ・API・状態遷移はルートのCONTEXT.mdに記録し、実装と同期する。\n\n## 受け入れ条件\n1. エピソードを作成・保存し、再読み込み後に開ける。\n2. 台本を生成または入力し、編集・保存・再読込できる。\n3. マイク録音を開始・停止・再生・やり直しできる。\n4. TTS成功・失敗が適切に表示される。\n5. AI音声と人間音声を区別して管理できる。\n6. 簡易編集後にプレビューでき、対応形式でダウンロードできる。\n7. 削除した素材へアクセスできない。\n8. 他人のデータにアクセスできず、秘密鍵がクライアントに露出しない。\n9. ローカル起動、テスト、デプロイの手順がある。\n\n## 未決事項\nTTSの利用可能性、音声形式、Cloudflare処理制限、書き出し方式、保存期限をPOCで確認する。\n", "MVP": "# MVP — Minimum Viable Product\n\n## 目的\n一人のクリエイターが、テーマから約3分の対話音声を制作し、完成ファイルをダウンロードできることを最短で検証する。\n\n## 中心体験\nテーマ入力 → AIが構成・質問案を作る → 人間が台本を確認 → 人間が録音 → AIホスト音声を生成 → プレビュー・簡易編集 → 書き出し。\n実装は人間の録音とダウンロードの縦切りを先に完成させ、TTSを次に加える。\n\n## 必須機能\n- 番組・エピソードの作成、一覧、保存、再読込\n- テーマ、対象リスナー、トーンの入力\n- 3分構成と話者別台本の生成または手入力、編集・保存\n- ブラウザマイク録音、再生、やり直し\n- AIホストTTSと人間音声の素材・トラック管理\n- 最小限の順序・開始終了・音量調整\n- プレビューと対応形式のダウンロード\n- エラー表示、素材削除、基本的な権限チェック\n\n## 今回は作らない\n自動配信、RSS、配信分析、リアルタイム全二重会話、高度なノイズ除去・DAW、チーム編集、決済、独自の声の学習、ネイティブアプリ。\n\n## 最小技術構成\nTypeScript + React、Cloudflare Workers + Hono、D1、非公開R2、MediaRecorder / Web Audio API、LLM/TTSアダプター。デプロイ先と音声処理方式はPOC結果で見直す。\n\n## 完了条件\n- 新規エピソードから音声ダウンロードまで主要フローを再現できる。\n- 保存した台本・素材を後から開ける。\n- マイク拒否、TTS失敗、録音失敗、書き出し失敗が判別できる。\n- 原音声を編集で上書きしない。\n- 他ユーザーのデータへアクセスできず、秘密鍵がクライアントに露出しない。\n- 主要フローのテストとCloudflareデプロイを確認する。\n- KPI計測方針とプライバシー説明がある。\n\n## リリース後に学ぶこと\n初回書き出し時間、工程別離脱、AIホスト利用率、2回目の制作率、時間のかかる工程、支払意思。\n", "POC": "# POC — Proof of Concept\n\n## 目的\n本実装前に、成立を左右する技術リスクと制作体験の仮説を小さく検証する。POCは完成品ではなく、結果を記録して設計判断に使う。\n\n## 検証項目\n\n| ID | 仮説 | 実験 | 合格条件 |\n|---|---|---|---|\n| POC-01 | ブラウザ録音を保存・再生できる | MediaRecorderで短い音声を録音 | 録音・再生・やり直しができる |\n| POC-02 | 日本語TTSが使える | 候補サービスで短い台詞を生成 | 音声、品質、遅延、料金、利用条件を記録 |\n| POC-03 | 人間音声とTTSを合わせられる | 2つの音声を順番に再生・ミックス | 音声出力が再生でき、順序と音量を制御 |\n| POC-04 | Cloudflareで保存・取得・削除できる | Workers、D1、R2の小規模実験 | 認可付きCRUDと制限・費用を確認 |\n| POC-05 | 3分制作フローが理解しやすい | 3〜5名に簡易UIを試してもらう | 詰まりと改善点を観察記録に残す |\n| POC-06 | 1本あたりの原価が許容範囲 | LLM/TTS/保存/出力コストを計測 | 実測原価を算出し価格仮説と比較 |\n\n## 推奨順序\n1. 録音・再生の縦切り\n2. 日本語TTS候補の品質・商用条件・遅延・コスト比較\n3. ミックス・書き出し方式と形式互換性\n4. D1/R2保存、認可、削除、サイズ制限\n5. 初見ユーザーによる操作テスト\n6. 実際のエピソードで変動費計測\n\n## 実験記録テンプレート\n- ID / 日付 / 実施者\n- 仮説、環境、ブラウザ、モデル、プロバイダー\n- 入力条件、再現手順、期待結果、実際の結果\n- 所要時間、エラー、コスト、制限\n- 合格 / 不合格 / 保留\n- 証拠（ログ、画像、短いテスト音声、コミット）\n- 設計への影響、次の判断\n\n## 必ず確認するリスク\n日本語TTSの自然さ・商用条件、生成遅延と失敗率、ブラウザごとのコーデック、ミックスとMP3/WAV出力、大きなファイルの転送制限、R2認可と削除整合、第三者音源・声の権利、1本あたりの変動費。\n\n## 判断ルール\n- 合格条件を満たす前に技術選定を確定しない。\n- 不合格ならプロバイダー変更、ブラウザ内処理、MVP縮小を比較する。\n- 実験結果がない項目を検証済みとしない。\n- 結果はCONTEXTまたはADR相当の記録へ反映し、PRD/MVPも同期する。\n", "コスト見積": "# MVP コスト・工数見積もり\n\n> 目的: MVP（T01〜T15）の実装工数と、リリース後の1エピソードあたり変動費を概算し、スコープと投資判断の材料とする。\n> 前提: 日本語3分番組、AIホスト＋人間話者、Cloudflare-first構成。\n> 注意: 単価はPOC確定前の仮定。確定後に本ファイルを更新すること。\n\n## 1. 実装工数見積もり（T01〜T15）\n\n工数は「実装＋単体テスト＋軽い手動確認＋関連文書更新」を含む目安。保守的に見積もっている。\n\n| ID | タスク | 内容 | 見積工数 | 累計 |\n|---|---|---:|---:|---:|\n| T01 | 最小アプリの骨格 | TypeScript + React + Hono + Wrangler 構成、型チェック・テストコマンド | 4〜6h | 4〜6h |\n| T02 | 画面の基本導線 | エピソード一覧・作成・詳細、空状態・読み込み中・エラー | 6〜8h | 10〜14h |\n| T03 | D1 CRUD | shows/episodes テーブル、入力検証、所有権境界 | 6〜8h | 16〜22h |\n| T04 | 台本エディター | 3分構成テンプレート、話者・発話順・本文編集、推定尺表示 | 10〜14h | 26〜36h |\n| T05 | 台本生成サービス | LLMアダプター、構造化出力検証、失敗時フォールバック | 10〜14h | 36〜50h |\n| T06 | ブラウザマイク録音 | 許可・録音・再生・やり直し、R2保存、asset記録 | 12〜16h | 48〜66h |\n| T07 | AIホスト音声生成 | TTSアダプター、承認済み台詞生成、R2保存、メタデータ | 8〜12h | 56〜78h |\n| T08 | 音声素材一覧・プレビュー | 人間/AI区別表示、再生・差し替え・削除整合 | 6〜8h | 62〜86h |\n| T09 | 最小トラック編集 | 順序変更、トリム、音量、編集JSON保存、プレビュー | 14〜18h | 76〜104h |\n| T10 | ミックスとダウンロード | ブラウザ/サーバー処理、MP3/WAVフォールバック、状態表示 | 14〜18h | 90〜122h |\n| T11 | 書き出しの堅牢性 | 空トラック・破損素材・長時間処理、重複実行防止、再試行 | 6〜8h | 96〜130h |\n| T12 | コンプライアンス確認 | 権利・出典・同意チェックリスト、重大警告 | 4〜6h | 100〜136h |\n| T13 | セキュリティレビュー | 秘密情報漏洩防止、認可、R2保護、入力検証、削除 | 6〜8h | 106〜144h |\n| T14 | E2E・受入テスト | 主要フローと失敗系、Windows Chrome/Edge | 10〜14h | 116〜158h |\n| T15 | Cloudflareデプロイ | D1/R2/Secrets設定、マイグレーション手順、URL確認 | 6〜8h | **122〜166h** |\n\n### 工数の解釈\n- フルタイム換算: 122h ÷ 8h ≈ 15営業日、166h ÷ 8h ≈ 21営業日\n- 週3日換算: 約5〜7週間\n- 週末・夜間作業: 2〜3ヶ月程度\n\n### スコープ圧縮候補（時間がない場合）\n時間がない場合は以下を優先して縦切りを完成させ、残りは後回しにする。\n\n| 優先 | タスク | 理由 |\n|---|---|---|\n| Must | T01, T02, T03 | 骨格・画面・永続化なしでは何も動かない |\n| Must | T04（簡易版） | 手入力台本だけでも縦切りを完成できる |\n| Must | T06 | 人間録音はMVPの核心体験 |\n| MUST | T09, T10（最小版） | トラック編集を省略し、単純な結合・ダウンロードに縮小可能 |\n| Should | T05 | LLM生成は手入力の代替。手入力が動けば後回し可能 |\n| Should | T07 | TTSも手入力台本＋録音のみなら後回し可能 |\n| Could | T08 | 一覧は最小でも可。削除整合だけはT06/T07とセット |\n| Could | T11, T12, T13, T14, T15 | セキュリティ・品質は重要だが、縦切り完成後に回す |\n\n### 最小縦切り案（工数目安 50〜70h）\n1. T01 + T02 + T03: 16〜22h\n2. T04 簡易台本保存: 6〜8h\n3. T06 人間録音＋R2保存: 12〜16h\n4. T10 単純ダウンロード（1トラック書き出し）: 8〜12h\n5. T13 最小認可チェック: 4h\n6. 手動テスト・デプロイ準備: 4〜8h\n\n合計: **50〜70h** で「テーマ→台本→録音→ダウンロード」の縦切りを完成できる。\n\n## 2. 運用変動費（1エピソードあたり）\n\nCloudflare の無料枠を前提に、1エピソード（3分）あたりの超過コストを試算。\n\n### 前提条件\n- LLM: 台本生成に 2回呼び出し、入力約 4,000 tokens、出力約 2,000 tokens\n- TTS: AIホスト台詞 約 300文字（日本語）、1回生成\n- 保存: 人間録音 WAV 約 5MB + TTS音声 約 2MB + 書き出しMP3 約 3MB = 約 10MB\n- ダウンロード: 10MB/回、月間 100エピソード書き出し\n- APIリクエスト: 1エピソードあたり約 50〜100リクエスト\n\n### 仮単価（POCで確定させること）\n| 項目 | 仮単価 | 備考 |\n|---|---|---|\n| LLM input | $0.00675 / 1K tokens | Workers AI llama-3.1-8b 想定（要確認） |\n| LLM output | $0.00675 / 1K tokens | Workers AI llama-3.1-8b 想定（要確認） |\n| TTS | $0.0015 / 1K文字 | 日本語TTSの目安（要確認） |\n| R2 ストレージ | $0.015 / GB・月 | 10MB × 100本 = 1GB/月 |\n| R2  egress | $0.09 / GB | 無料枠 10GB/月を超えた場合 |\n| Workers リクエスト | $0.50 / 100万リクエスト | 無料枠 10万/日を超えた場合 |\n\n### 試算\n| 項目 | 計算 | 1エピソードコスト |\n|---|---|---:|\n| LLM input | 4K tokens × $0.00675/1K | $0.027 |\n| LLM output | 2K tokens × $0.00675/1K | $0.0135 |\n| TTS | 0.3K文字 × $0.0015/1K | $0.00045 |\n| R2 ストレージ | 10MB × $0.015/GB（月次換算） | ~$0.00015 |\n| R2 egress | 10MB × $0.09/GB（無料枠超過時） | ~$0.0009 |\n| Workers | 100リクエスト分（無料枠内） | ~$0 |\n| **合計** | | **約 $0.04〜0.05 / エピソード** |\n\n### 月間100エピソード運用時\n- LLM: $4.05\n- TTS: $0.045\n- R2 ストレージ: ~$0.015\n- R2 egress: ~$0.09（無料枠10GB内に収まる）\n- Workers: 無料枠内\n- **月間合計: 約 $4.10〜$5.00**\n\n### 注意点\n- **TTSの品質と価格が最も不確定**: POC-02 で必ず確認。\n- **ミックス処理をWorkers上でffmpeg.wasm等で行う場合**: CPU時間・メモリ制限に引っかかる可能性あり。ブラウザ内処理ならサーバー原価は下がるが、互換性が課題。\n- **無料枠を超えるまで実質コストはほぼゼロ**。初期検証ではコストより「制限・レイテンシ・失敗率」が重要。\n\n## 3. 結論・アクション\n\n1. **工数面**: MVPフルスコープは約 122〜166h。時間がないなら、**最小縦切り案（50〜70h）**で「テーマ→台本（手入力可）→録音→ダウンロード」を先に完成させる。\n2. **コスト面**: 1エピソードあたりの変動費は約 $0.04〜0.05 と非常に小さい。原価よりも**開発工数・POCリスク**が大きな投資対象。\n3. **POC優先**: TTS単価・品質・Workers AIの制限は確定前に見積もりを再計算すること。\n\n## 4. 計算シート（更新用）\n\n```yaml\n# docs/cost-assumptions.yaml として保存推奨\nllm:\n  input_tokens_per_episode: 4000\n  output_tokens_per_episode: 2000\n  input_price_per_1k: 0.00675   # USD、POC確定後更新\n  output_price_per_1k: 0.00675  # USD、POC確定後更新\n\ntts:\n  chars_per_episode: 300\n  price_per_1k_chars: 0.0015    # USD、POC確定後更新\n\nstorage:\n  mb_per_episode: 10\n  price_per_gb_month: 0.015     # USD\n\negress:\n  mb_download_per_episode: 10\n  price_per_gb: 0.09            # USD\n\nrequests:\n  requests_per_episode: 100\n  price_per_million: 0.50       # USD\n```\n", "CONTEXT": "# CONTEXT.md — Podcast Agent decisions\n\n## Product decision\n\n- Product: Podcast Agent\n- Primary use case: AI host and human co-create a short conversational interview.\n- Default format: approximately 3 minutes.\n- Recording: AI host audio generated by TTS + human voice recorded through the browser microphone.\n- Output: downloadable audio file.\n- Deployment preference: Cloudflare-first.\n- Primary user: an individual creator producing short episodes.\n\n## MVP user journey\n\n1. Create a show or episode and enter topic, audience, tone, and goal.\n2. Generate an editable 3-minute outline and script.\n3. Review and approve the script.\n4. Record the human voice in the browser.\n5. Generate AI host lines through a TTS adapter.\n6. Review and arrange both voices as tracks.\n7. Make basic cuts and volume adjustments.\n8. Preview and export the final audio.\n9. Download the output; retain or delete project assets.\n\n## Editorial format\n\n| Time | Segment | Notes |\n|---|---|---|\n| 00:00–00:15 | Opening | Host introduces the theme and question |\n| 00:15–00:35 | Setup | Brief context and human speaker's perspective |\n| 00:35–02:20 | Conversation | 2–3 focused questions; human responses |\n| 02:20–02:50 | Takeaway | Main insight and summary |\n| 02:50–03:00 | Closing | Sign-off and next question |\n\nThe runtime is a target, not a reason to truncate speech automatically. Show measured duration and suggest shortening the script when over target.\n\n## Architecture decisions\n\n- Frontend: TypeScript + React.\n- API: Cloudflare Workers + Hono.\n- Database: Cloudflare D1.\n- Audio object storage: private Cloudflare R2 bucket.\n- Browser recording and preview: MediaRecorder and Web Audio API where supported.\n- AI provider calls happen server-side; secrets are stored in Cloudflare secrets, never in browser code.\n- Model, TTS, and audio-export implementations are behind interfaces/adapters.\n- The first release should not require a dedicated always-on server.\n- Prefer synchronous requests for short operations. Move long-running work to durable/asynchronous execution only when needed.\n- Do not assume MP3 encoding is available in every browser/runtime. Verify the encoder; provide WAV as fallback if MP3 is unavailable.\n\n## Agent/service responsibilities\n\nThese are logical responsibilities, not a requirement to run seven independent agents.\n\n- Producer: episode state, workflow guidance, handoff between steps.\n- Planner: run of show, time budget, interview questions.\n- Scriptwriter: speaker turns and editable script.\n- Host Voice: TTS generation for approved AI host lines.\n- Compliance: flag unsupported factual claims, unattributed quotations, third-party audio/voice rights, and missing disclosure.\n- Editor: track ordering, trim points, volume, preview mix.\n- Exporter: final encoding, file metadata, download.\n- Human creator: approve script, confirm recording consent and rights, review final audio before distribution.\n\n## Data model (logical schema)\n\n### shows\n- `id`: string/UUID primary key\n- `title`: string, required\n- `description`: string, optional\n- `language`: string, default `ja-JP`\n- `tone`: string, optional\n- `target_duration_seconds`: integer, default 180\n- `created_at` / `updated_at`: ISO timestamp\n\n### episodes\n- `id`: string/UUID primary key\n- `show_id`: foreign key to shows\n- `title`: string, required\n- `topic`: string, required\n- `audience`: string, optional\n- `status`: `draft | scripting | ready_to_record | recording | editing | exporting | completed | error`\n- `target_duration_seconds`: integer, default 180\n- `created_at` / `updated_at`: ISO timestamp\n\n### scripts\n- `id`: string/UUID primary key\n- `episode_id`: foreign key to episodes\n- `version`: integer\n- `content_json`: structured speaker turns and sections\n- `estimated_duration_seconds`: integer, nullable\n- `approval_status`: `draft | approved | changes_requested`\n- `created_at`: ISO timestamp\n\n### assets\n- `id`: string/UUID primary key\n- `episode_id`: foreign key to episodes\n- `kind`: `human_recording | host_tts | music | effect | mix | export`\n- `r2_key`: private object key\n- `mime_type`: string\n- `size_bytes`: integer\n- `duration_seconds`: number, nullable\n- `metadata_json`: provider/model, voice label, sample rate, consent and provenance metadata where relevant\n- `created_at`: ISO timestamp\n- `deleted_at`: ISO timestamp, nullable\n\n### tracks\n- `id`: string/UUID primary key\n- `episode_id`: foreign key to episodes\n- `asset_id`: foreign key to assets\n- `speaker`: `human | ai_host | music | effect`\n- `position`: integer\n- `start_ms` / `end_ms`: integer\n- `gain_db`: number, default 0\n- `created_at` / `updated_at`: ISO timestamp\n\n### exports\n- `id`: string/UUID primary key\n- `episode_id`: foreign key to episodes\n- `asset_id`: foreign key to assets, nullable until success\n- `format`: `mp3 | wav`\n- `status`: `queued | processing | completed | failed`\n- `error_code` / `error_message`: nullable\n- `created_at` / `completed_at`: ISO timestamp, nullable\n\n### compliance_checks\n- `id`: string/UUID primary key\n- `episode_id`: foreign key to episodes\n- `category`: `factual_claim | quotation | music_rights | voice_rights | consent | disclosure`\n- `severity`: `info | warning | blocking`\n- `message`: string\n- `evidence_json`: structured evidence/source references, nullable\n- `resolved_at`: timestamp, nullable\n- `created_at`: ISO timestamp\n\n## API sketch\n\n- `GET /api/shows`\n- `POST /api/shows`\n- `GET /api/episodes`\n- `POST /api/episodes`\n- `GET /api/episodes/:id`\n- `PATCH /api/episodes/:id`\n- `DELETE /api/episodes/:id`\n- `POST /api/episodes/:id/script/generate`\n- `PUT /api/episodes/:id/script`\n- `POST /api/episodes/:id/tts`\n- `POST /api/episodes/:id/exports`\n- `GET /api/exports/:id`\n- `DELETE /api/assets/:id`\n\nThis is a starting contract. Adjust paths to the actual authentication and upload design. Validate inputs and enforce authorization at the API boundary.\n\n## Security and privacy rules\n\n- Do not expose R2 object keys as public URLs.\n- Require authorization for every episode and asset operation.\n- Use short-lived download links or an authorized download endpoint.\n- Set file-size and duration limits for uploaded recordings.\n- Ask for microphone permission only when recording is requested and show recording state.\n- Provide a clear delete action for recordings and generated audio.\n- Keep provider secrets on the server.\n- Preserve source recordings when editing; edits should be non-destructive.\n- Treat AI-generated claims as unverified until reviewed. Do not invent sources.\n- Do not use cloned or identifiable third-party voices without appropriate permission.\n- Before sharing or distributing audio, the human creator confirms consent, attribution, and usage rights.\n\n## Acceptance criteria\n\n1. A show and episode can be created, edited, and reloaded without losing saved data.\n2. The user can edit and save a structured script with speaker turns.\n3. The browser can record, stop, replay, and redo a human recording.\n4. Approved AI host text can be sent to TTS and the returned audio can be previewed.\n5. Human and AI audio are represented as separate assets/tracks.\n6. The user can reorder tracks and set basic trim points and gain.\n7. The preview reflects the saved edit plan.\n8. A supported output format can be exported and downloaded; failures are visible and retryable.\n9. Deleting an asset removes or invalidates both its metadata and stored object.\n10. Unauthorized users cannot access another user's episodes, assets, or downloads.\n11. No provider secret is included in client bundles or API responses.\n12. The core flow works in current Chrome/Edge on Windows, with microphone denial and unsupported codecs handled gracefully.\n\n## Out of scope for MVP\n\n- Direct publishing to podcast platforms, RSS, and analytics integrations.\n- Real-time full-duplex voice conversation.\n- Advanced DAW features, collaborative editing, subscriptions, and model training.\n- Automatic fact verification as a substitute for human review.\n", "CLAUDE": "# CLAUDE.md — Podcast Agent project rules\n\n## Project overview\n\nBuild a Cloudflare-first web app for producing approximately 3-minute interview/conversation episodes with an AI host and a human speaker. The user can plan and edit a script, generate AI host audio, record their own voice in the browser, make basic edits, and download a finished audio file.\n\nRead `README.md`, `CONTEXT.md`, and `TASKS.md` before implementation. These files define the product scope, decisions, data model, acceptance criteria, and task order.\n\n## Rules for the coding agent\n\n- Respond and document in Japanese unless a code/API name is clearer in English.\n- Work on one small task at a time; select the next unchecked task in `TASKS.md`.\n- Before coding, briefly state the task, intended files, and verification plan.\n- Do not mark a task complete until the code is implemented and its verification has been run.\n- Prefer the smallest working vertical slice over scaffolding for future features.\n- Keep provider-specific LLM/TTS code behind typed interfaces so providers can be replaced.\n- Keep provider secrets server-side in Cloudflare secrets; never ship secrets to the browser.\n- Validate all inputs and enforce authorization on episode, asset, and download operations.\n- Keep R2 audio objects private and implement a deliberate deletion path.\n- Treat edits as non-destructive; do not overwrite original recordings when trimming or mixing.\n- Make failures understandable to the user and provide retry paths where safe.\n- Never invent citations or imply that AI-generated claims have been verified.\n- Human approval is required before the final audio is considered ready for distribution.\n- Update README/CONTEXT when a real product decision changes.\n\n## Verification\n\n- Run the available typecheck, lint, and tests after each meaningful change.\n- Add focused tests for validation, state transitions, authorization, storage cleanup, and export failure handling.\n- Manually verify the flow in Chrome or Edge on Windows, including microphone denial and unsupported audio formats.\n- Review security and privacy implications before declaring a task complete.\n- Do not claim Cloudflare deployment succeeded unless the deployment command reports success and the deployed URL has been checked.\n\n## Keep out of scope\n\nDo not add direct podcast-platform publishing, RSS, analytics integrations, real-time full-duplex voice chat, advanced DAW features, billing, or custom model training without an explicit product decision.\n"};
    const content = document.getElementById('content');
    const buttons = document.querySelectorAll('nav button');

    function render(key, btn) {
      buttons.forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      content.innerHTML = marked.parse(docs[key] || '# 未找到');
    }

    buttons.forEach(btn => {
      btn.addEventListener('click', () => render(btn.dataset.key, btn));

    render('MRD', buttons[0]);
  </script>
